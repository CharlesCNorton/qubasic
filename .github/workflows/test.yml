name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        extras: ["charts"]
        include:
          - os: windows-latest
            python-version: "3.12"
            extras: "charts"
          - os: macos-latest
            python-version: "3.12"
            extras: "charts"
          - os: ubuntu-latest
            python-version: "3.12"
            extras: "charts,qec,jupyter"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[${{ matrix.extras }}]" pytest pytest-cov hypothesis
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short --cov=qubasic_core --cov-report=term-missing --cov-fail-under=88

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[charts]" mypy ruff
      - name: Ruff
        run: ruff check qubasic_core tests tools
      - name: Mypy
        run: mypy qubasic_core
      - name: HostState and docs/reference.md match the code
        run: python tools/generate.py --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: pip install build twine && python -m build && twine check dist/*
      - name: Install the wheel and run a program
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "from qubasic_core import run; r = run('10 H 0\n20 CX 0, 1\n30 MEASURE', qubits=2, shots=200, seed=1); assert set(r['counts']) <= {'00', '11'}, r"
