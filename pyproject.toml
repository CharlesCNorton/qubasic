[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qubasic"
version = "0.30.0"
description = "Quantum BASIC Interactive Terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Charles C. Norton", email = "machineelv@gmail.com"},
]
keywords = ["quantum", "computing", "qiskit", "basic", "repl", "simulator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
    "numpy>=1.24",
    "scipy>=1.5",
    "rustworkx>=0.14",
    "psutil>=5.9",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/CharlesCNorton/qubasic"
Repository = "https://github.com/CharlesCNorton/qubasic"
Issues = "https://github.com/CharlesCNorton/qubasic/issues"

[project.optional-dependencies]
charts = ["plotille>=5.0"]
readline = ["pyreadline3>=3.4; sys_platform == 'win32'"]
qasm3 = ["qiskit-qasm3-import>=0.4"]
qec = ["stim>=1.12", "pymatching>=2.1"]
jupyter = ["ipykernel>=6.0", "jupyter-client>=7.0"]

[project.scripts]
qubasic = "qubasic_core.cli:main"

[tool.setuptools]
packages = ["qubasic_core"]

[tool.setuptools.data-files]
"share/qubasic/examples" = ["examples/*.qb", "examples/*.bas"]

[tool.pytest.ini_options]
markers = ["real_sim: runs larger Qiskit Aer simulations"]

[tool.coverage.run]
source = ["qubasic_core"]
omit = ["*/test_*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Every function is annotated and every body is checked. QBasicTerminal's
# mixins share attributes and methods through HostState (qubasic_core/host.py),
# which declares each with its type or signature.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6", "I"]
# `l` names a logical-qubit or level index throughout the QEC code.
ignore = ["E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["qubasic_core"]

[tool.ruff.lint.per-file-ignores]
# terminal.py filters a dependency warning before its imports run.
"qubasic_core/terminal.py" = ["E402"]
"tests/*" = ["E402", "E701", "E702", "F541"]
